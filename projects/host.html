<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base Development Board for Sensor Modules V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      color: black;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .logo {
      position: fixed;
      top: 1.2rem;
      left: 1.8rem;
      z-index: 1000;
      text-decoration: none;
    }

    .logo img {
      height: 70px;      /* adjust as needed */
      width: 70px;
      display: block;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .logo:hover img {
      opacity: 0.8;
      transform: scale(1.1);
    }

    .underlined-title {
      border-bottom: 2px solid black;
      padding-bottom: 0.3em;
      margin-bottom: 1.2em;
    }

    a {
      color: black;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 2rem
    }

    .hero {
      width: 100%;
      height: 500px;
      object-fit: cover;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    h1 {
      margin-bottom: 1rem;
    }

    .main-image {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-image img {
      width: 100%;
      max-width: 900px;
      max-height: 450px;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    section {
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    section p {
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .related-link {
      text-decoration: underline;
    }

    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      justify-items: center;
      margin-top: 1.5rem;
    }
        
    .image-grid img {
      max-width: 450px;
      width: 100%;
      border-radius: 6px;
      height: auto;
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  
  <a href="../index.html" class="logo">
    <img src="../images/logo.png" alt="Allen Ai logo">
  </a>

  <a href="../index.html" style="display:inline-block; margin-top:2.5rem;">← Back to Projects</a>

  <div style="height: 0.4rem;"></div>

  <h1>Sensor Host Board</h1>
  <h2>03/2026 - Present</h2>

  <div class="main-image">
    <img src="../images/host-2.png" alt="Sensor Host Board Isometric Model" class="hero">
  </div>

  <section>
    <div class="underlined-title">
      <h2>Overview</h2>
    </div>

    <p>...</p>
    <div class="related-link">
      <a href="https://github.com/VEXU-GHOST/ghost_kicad">Check it out on the VEXU GHOST PCB Github Repository</a>
    </div>
    
    <div style="height: 2.5rem;"></div>

    <div class="underlined-title">
      <h2>Images</h2>
    </div>
    <div class="image-grid">
      <img src="../images/host-5.png" alt="Sensor Host Board Schematic 1">
      <img src="../images/host-6.png" alt="Sensor Host Board Schematic 2">
      <img src="../images/host-3.png" alt="Sensor Host Board PCB Layout Front">
      <img src="../images/host-4.png" alt="Sensor Host Board PCB Layout Back">
      <img src="../images/host.png" alt="Sensor Host Board PCB 3D Model Front">
      <img src="../images/host-1.png" alt="Sensor Host Board PCB 3D Model Back">
      <img src="../images/host-2.png" alt="Sensor Host Board PCB 3D Model Isometric">
    </div>
  </section>

</body>
</html>
